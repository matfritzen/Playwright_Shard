variables:
  ENVIRONMENT: 'qa'

.setup-env-variables: &setup-env-variables
  - export ENVIRONMENT=$ENVIRONMENT
  - export TEST=$TEST #Variable setup in the Settings > CI/CD configuration


shard-test-job-1: # Running tests split in the 3 shards
  image: mcr.microsoft.com/playwright:v1.51.0-noble   # This job runs in the test stage.
  stage: test    # It only starts when the job in the build stage completes successfully.
  script:
    - *setup-env-variables 
    - npm ci # Install NPM packages
    - npx playwright install --with-deps # Install Playwright browsers and dependencies 
    - npx playwright test --reporter blob --shard=1/3
  artifacts:
    when: always
    access: all
    expire_in: 30 days
    paths:
      - blob-report/*

shard-test-job-2: # Running tests split in the 3 shards
  image: mcr.microsoft.com/playwright:v1.51.0-noble   # This job runs in the test stage.
  stage: test # It only starts when the job in the build stage completes successfully.
  script:
    - *setup-env-variables
    - npm ci # Install NPM packages
    - npx playwright install --with-deps # Install Playwright browsers and dependencies 
    - npx playwright test --reporter blob --shard=2/3
  artifacts:
    when: always
    access: all
    expire_in: 30 days
    paths:
      - blob-report/*

shard-test-job-3: # Running tests split in the 3 shards
 image: mcr.microsoft.com/playwright:v1.51.0-noble   # This job runs in the test stage.
 stage: test    # It only starts when the job in the build stage completes successfully.
 script:
   - *setup-env-variables
   - npm ci # Install NPM packages
   - npx playwright install --with-deps # Install Playwright browsers and dependencies 
   - npx playwright test --reporter blob --shard=3/3
 artifacts:
   when: always
   access: all
   expire_in: 30 days
   paths:
     - blob-report/*

merge-test-reports:
 stage: merge
 when: always #always run when shards fail
 image: mcr.microsoft.com/playwright:v1.51.0-noble 
 script:
   - npm ci # Install NPM packages
   - npx playwright merge-reports --reporter html ./blob-report
 artifacts:
   when: always
   access: all
   expire_in: 30 days
   paths:
     - playwright-report/**


