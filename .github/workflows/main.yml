name: Playwright Tests
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
jobs:
  shard-test-job-1:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --reporter blob --shard=1/3
    - uses: actions/upload-artifact@v4
      with:
        when: always()
        name: playwright-report
        path: blob-report/*
        retention-days: 30
        
  shard-test-job-2:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --reporter blob --shard=2/3
    - uses: actions/upload-artifact@v4
      with:
        when: always()
        name: playwright-report
        path: blob-report/*
        retention-days: 30
        
  shard-test-job-3:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Run Playwright tests
      run: npx playwright test --reporter blob --shard=3/3
    - uses: actions/upload-artifact@v4
      with:
        when: always()
        name: playwright-report
        path: blob-report/*
        retention-days: 30

  merge-test-reports:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Merging Playwright Reports
      run: npx playwright merge-reports --reporter html ./blob-report
    - uses: actions/upload-artifact@v4
      with:
        when: always()
        name: playwright-report
        path: playwright-report/**
        retention-days: 30
    
